<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: installed on an iPhone, the app draws under the status bar and the
         safe-area insets keep text clear of the notch. Without it iOS reports insets of 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Life Tracker</title>
    <meta name="description" content="A private log for food, habits, study time, steps, sleep and your daily route." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life Tracker" />
    <meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* The app's own background before the first frame, so launch doesn't flash white. */
        background: #f2f3f5;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0b0d12;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
